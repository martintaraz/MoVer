<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link href="./index.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<title>browser_pool test animation</title>
</head>
<body>
<!-- Body structure mirrors the pipeline's template.html: content before AND
     after the SVG, plus a display:none element. Batched capture must hide all
     of it without disturbing inline styles. -->
<p id="prompt">browser_pool test animation</p>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect id="background" x="0" y="0" width="200" height="200" fill="#00c800"/>
  <circle id="ball" cx="40" cy="60" r="20" fill="#d62728"/>
  <rect id="box" x="130" y="120" width="40" height="40" fill="#1f77b4"/>
</svg>
<br/>
<button>Play</button>
<button>Pause</button>
<button>Convert</button>
<p id="sys-msg-path" style="display:none"></p>
<script>
  // Deterministic 2-second animation: linear motion + rotation, no easing.
  const tl = gsap.timeline();
  tl.to("#ball", { x: 120, duration: 2, ease: "none" }, 0);
  tl.to("#box", { rotation: 180, transformOrigin: "50% 50%", duration: 1.5, ease: "none" }, 0.5);
  let tl_to_use = tl;
</script>
<script src="./convert.js"></script>
</body>
</html>
